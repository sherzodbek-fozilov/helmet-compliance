<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контроль касок</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="header">
    <a class="header__logo" href="{{ url_for('index') }}">Контроль касок</a>
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">История</a>
      <a href="{{ url_for('upload') }}" class="{{ 'active' if request.endpoint == 'upload' else '' }}">Обработка</a>
      <a href="{{ url_for('persons_journal') }}" class="{{ 'active' if request.endpoint == 'persons_journal' else '' }}">Журнал персон</a>
    </nav>
  </header>
  <main class="main">{% block content %}{% endblock %}</main>
</body>
</html>
